<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cardGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F8E9E4"/>
    </radialGradient>
    <radialGradient id="watercolourBlob" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#EAC6BA" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#F8E9E4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1B8"/>
      <stop offset="40%" stop-color="#E2B34F"/>
      <stop offset="70%" stop-color="#BA9048"/>
      <stop offset="100%" stop-color="#8A5F10"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A1408" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#cardGrad)"/>

  <!-- Soft Blush Watercolour Wash Texture -->
  <ellipse cx="400" cy="460" rx="280" ry="260" fill="url(#watercolourBlob)"/>

  <!-- Subtle Hairline Inner Border -->
  <rect x="24" y="24" width="752" height="952" rx="14" fill="none" stroke="#BA9048" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Gold Four-Petal Flower Brand Accent at Top -->
  <g transform="translate(400, 75) scale(0.9)" fill="#BA9048">
    <path d="M0 -18 C3 -6 12 3 24 0 C12 -3 3 -12 0 -24 C-3 -12 -12 -3 -24 0 C-12 3 -3 6 0 18 Z" />
    <circle cx="0" cy="0" r="3.5" fill="#FFFDF9"/>
  </g>

  <!-- Brand Wordmark Top -->
  <text x="400" y="125" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" letter-spacing="4" fill="#2A1408" font-weight="500">PHABULOUS</text>
  <text x="400" y="148" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="13" letter-spacing="2" font-style="italic" fill="#8A5F10">By Mitthat</text>

  <!-- Center Artwork Display: Gold Jhumka Motif & Illustrative Jewellery Piece -->
  <g transform="translate(400, 430)" filter="url(#shadow)">
    <!-- Base Tray Halo -->
    <ellipse cx="0" cy="180" rx="160" ry="24" fill="#2A1408" fill-opacity="0.08"/>

    <!-- Gold Bell / Jhumka Dome -->
    <path d="M-80,80 C-80,10 -60,-60 0,-70 C60,-60 80,10 80,80 Z" fill="url(#goldShimmer)"/>
    <ellipse cx="0" cy="80" rx="80" ry="18" fill="#A9781C"/>

    <!-- Intricate filigree arcs -->
    <path d="M-60,75 C-40,40 40,40 60,75" stroke="#FFF1B8" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M-45,50 C-20,25 20,25 45,50" stroke="#FFF1B8" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- Hanging Pearls / Droplets -->
    <circle cx="-65" cy="105" r="7" fill="#FFFDF9" stroke="#BA9048" stroke-width="1.5"/>
    <circle cx="-35" cy="115" r="8" fill="#FFFDF9" stroke="#BA9048" stroke-width="1.5"/>
    <circle cx="0" cy="122" r="9" fill="#FFFDF9" stroke="#BA9048" stroke-width="1.5"/>
    <circle cx="35" cy="115" r="8" fill="#FFFDF9" stroke="#BA9048" stroke-width="1.5"/>
    <circle cx="65" cy="105" r="7" fill="#FFFDF9" stroke="#BA9048" stroke-width="1.5"/>

    <!-- Stud / Top Crest -->
    <circle cx="0" cy="-110" r="22" fill="url(#goldShimmer)"/>
    <circle cx="0" cy="-110" r="14" fill="#FFFFFF"/>
    <circle cx="0" cy="-110" r="8" fill="#5B1626"/>
    <line x1="0" y1="-88" x2="0" y2="-70" stroke="#BA9048" stroke-width="4"/>
  </g>

  <!-- Product Title & Angle Tag -->
  <text x="400" y="760" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" fill="#2A1408">Meenakari Flower Studs</text>
  <text x="400" y="795" text-anchor="middle" font-family="'Jost', system-ui, sans-serif" font-size="14" letter-spacing="1" fill="#4E3C2A" opacity="0.85">Hand-painted Blush Enamel</text>

  <!-- Angle Pill Tag -->
  <g transform="translate(400, 840)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#F8E9E4" stroke="#BA9048" stroke-width="1" stroke-opacity="0.4"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Jost', system-ui, sans-serif" font-size="12" font-weight="500" fill="#8A5F10" letter-spacing="0.5">Detail Angle</text>
  </g>

  <!-- Bottom Brand Footnote -->
  <text x="400" y="930" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="13" font-style="italic" fill="#7A6F5F">Handpicked jewellery, simply irresistible</text>
</svg>