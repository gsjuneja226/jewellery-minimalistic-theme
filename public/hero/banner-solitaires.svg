<svg width="1200" height="550" viewBox="0 0 1200 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgDarkChic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="50%" stop-color="#0E1117"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>
    <linearGradient id="silverPlat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D9DEE8"/>
      <stop offset="100%" stop-color="#9AA3B5"/>
    </linearGradient>
    <radialGradient id="adSpark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E8F4FF"/>
      <stop offset="80%" stop-color="#A5C7F0"/>
      <stop offset="100%" stop-color="#5588C0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="550" fill="url(#bgDarkChic)"/>
  <circle cx="850" cy="275" r="300" fill="#9AA3B5" fill-opacity="0.12"/>

  <!-- Left Side: Integrated Typography -->
  <g transform="translate(100, 210)">
    <text x="0" y="0" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" letter-spacing="6" fill="#FFFFFF" font-weight="600">
      TIMELESS BRILLIANCE
    </text>
    <text x="0" y="65" font-family="'Brush Script MT', 'Great Vibes', 'Cormorant Garamond', 'Baskerville', cursive, serif" font-size="74" font-style="italic" fill="url(#silverPlat)" font-weight="400">
      Solitaires & AD
    </text>
    <text x="0" y="115" font-family="system-ui, sans-serif" font-size="13" letter-spacing="3" fill="#A5C7F0" font-weight="500">
      HIGH-CLARITY AMERICAN DIAMOND COCKTAIL RINGS
    </text>
  </g>

  <!-- Right Side: Solitaire Ring & Tennis Bracelet Illustration -->
  <g transform="translate(850, 260)">
    <!-- Solitaire Ring Band -->
    <ellipse cx="0" cy="50" rx="90" ry="110" fill="none" stroke="url(#silverPlat)" stroke-width="16" transform="rotate(-20)"/>
    <!-- Pave stones in band -->
    <ellipse cx="0" cy="50" rx="90" ry="110" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="6 8" transform="rotate(-20)"/>

    <!-- 6-Prong Head -->
    <g transform="translate(-40, -50)">
      <path d="M-30,10 L-40,-15 L-20,-10 L-5,-20 L15,-10 L35,-15 L25,10 Z" fill="url(#silverPlat)"/>
      <!-- Brilliant Cut Round Solitaire Gem -->
      <polygon points="0,-65 42,-25 32,15 -32,15 -42,-25" fill="url(#adSpark)" stroke="#FFFFFF" stroke-width="2"/>
      <polygon points="0,-65 18,-25 0,15 -18,-25" fill="#FFFFFF" fill-opacity="0.6"/>
      <!-- Light Flares -->
      <line x1="0" y1="-85" x2="0" y2="-45" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <line x1="-20" y1="-65" x2="20" y2="-65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-12" cy="-35" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Flowing Tennis Bracelet Below -->
    <path d="M-180,120 Q-40,80 80,140 T220,110" fill="none" stroke="url(#silverPlat)" stroke-width="10"/>
    <path d="M-180,120 Q-40,80 80,140 T220,110" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="10 6"/>
  </g>
</svg>