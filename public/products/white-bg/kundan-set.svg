<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Realistic Gold Metallic Shaders -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="25%" stop-color="#FCE5A2"/>
      <stop offset="55%" stop-color="#D9A74A"/>
      <stop offset="85%" stop-color="#B88628"/>
      <stop offset="100%" stop-color="#805611"/>
    </linearGradient>
    <linearGradient id="rhodiumShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F2F4F8"/>
      <stop offset="65%" stop-color="#D0D6E2"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F2"/>
      <stop offset="30%" stop-color="#F7C4B8"/>
      <stop offset="70%" stop-color="#D98A7B"/>
      <stop offset="100%" stop-color="#9E5345"/>
    </linearGradient>
    <!-- Soft Studio Ground Contact Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1817" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#1A1817" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Sparkling Gem Gradients -->
    <radialGradient id="diamondFacet" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E8F4FF"/>
      <stop offset="85%" stop-color="#BDD8F5"/>
      <stop offset="100%" stop-color="#7EA5D1"/>
    </radialGradient>
    <radialGradient id="sapphireFacet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4F95FF"/>
      <stop offset="45%" stop-color="#1A56C4"/>
      <stop offset="85%" stop-color="#0B2F7A"/>
      <stop offset="100%" stop-color="#041438"/>
    </radialGradient>
    <radialGradient id="emeraldFacet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#54DF9D"/>
      <stop offset="45%" stop-color="#15975F"/>
      <stop offset="85%" stop-color="#085B38"/>
      <stop offset="100%" stop-color="#022918"/>
    </radialGradient>
    <radialGradient id="rubyFacet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF6B8B"/>
      <stop offset="45%" stop-color="#D11545"/>
      <stop offset="85%" stop-color="#800624"/>
      <stop offset="100%" stop-color="#400211"/>
    </radialGradient>
  </defs>

  <!-- PURE WHITE BACKGROUND (#FFFFFF) -->
  <rect width="600" height="600" fill="#FFFFFF"/>

  <!-- Soft Studio Contact Shadow -->
  <ellipse cx="300" cy="480" rx="170" ry="16" fill="url(#groundShadow)"/>

  <!-- Centered Isolated Jewellery Graphic -->
  
  <g transform="translate(300, 260)">
    <path d="M-180,-20 Q0,100 180,-20" fill="none" stroke="url(#goldShine)" stroke-width="32" stroke-linecap="round"/>
    <g fill="#FFFDEB" stroke="#B88628" stroke-width="2.5">
      <rect x="-140" y="2" width="22" height="22" rx="4" transform="rotate(15 -129 13)"/>
      <rect x="-90" y="26" width="24" height="24" rx="4" transform="rotate(22 -78 38)"/>
      <rect x="-35" y="44" width="26" height="26" rx="4" transform="rotate(10 -22 57)"/>
      <rect x="10" y="44" width="26" height="26" rx="4" transform="rotate(-10 23 57)"/>
      <rect x="66" y="26" width="24" height="24" rx="4" transform="rotate(-22 78 38)"/>
      <rect x="118" y="2" width="22" height="22" rx="4" transform="rotate(-15 129 13)"/>
    </g>
    <!-- Emerald Drops -->
    <g fill="url(#emeraldFacet)" stroke="#BA9048" stroke-width="1.5">
      <ellipse cx="-125" cy="45" rx="7" ry="14"/>
      <ellipse cx="-75" cy="72" rx="8" ry="16"/>
      <ellipse cx="-20" cy="92" rx="9" ry="18"/>
      <ellipse cx="20" cy="92" rx="9" ry="18"/>
      <ellipse cx="75" cy="72" rx="8" ry="16"/>
      <ellipse cx="125" cy="45" rx="7" ry="14"/>
    </g>
    <!-- Pearl cluster beads -->
    <g fill="#FFFBF0">
      <circle cx="-125" cy="62" r="4"/><circle cx="-75" cy="90" r="4.5"/>
      <circle cx="-20" cy="112" r="5"/><circle cx="20" cy="112" r="5"/>
      <circle cx="75" cy="90" r="4.5"/><circle cx="125" cy="62" r="4"/>
    </g>
  </g>

</svg>